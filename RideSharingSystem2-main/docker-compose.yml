services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ridesharing-backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ridesharing-backend"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:7
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
    depends_on:
      - db

  backend:
    build:
      context: ./Backend/ridesharing-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ridesharing-backend
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      SERVER_PORT: 9090
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "6565:9090" # host:container (host uses 6565 to avoid conflicts)

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:6565
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  pgadmindata:
